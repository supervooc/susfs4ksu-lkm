    <section class="section faq-section" id="faq" aria-labelledby="faq-title">
      <div class="container faq-grid">
        <div class="faq-intro reveal">
          <span class="section-kicker">{{ c.FAQ_KICKER }}</span>
          {% with h=c.FAQ_HEADLINE, heading_id="faq-title" %}{% include "partials/headline.html" %}{% endwith %}
          <p>{{ c.FAQ_INTRO }}</p>
          <a class="text-link" href="{{ c.FAQ_LINK[1] }}" target="_blank" rel="noopener noreferrer">
            {{ c.FAQ_LINK[0] }}
            {{ icon('arrow-right') }}
          </a>
        </div>

        <div class="faq-list reveal">
          {%- for item in c.FAQ %}
          <details>
            <summary><span>{{ inline(item.question) }}</span><span class="faq-plus" aria-hidden="true"></span></summary>
            <p>{{ inline(item.answer) }}</p>
          </details>
          {%- endfor %}
        </div>
      </div>
    </section>
