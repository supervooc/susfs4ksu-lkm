<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    document.documentElement.classList.add('js');
    window.setTimeout(function () {
      if (document.querySelector('.reveal.is-visible')) return;
      document.querySelectorAll('.reveal').forEach(function (el) {
        el.classList.add('is-visible');
      });
    }, 1400);
  </script>
  <title>{{ page_title if page_title is defined else c.TITLE }}</title>
  <meta name="description" content="{{ meta_description if meta_description is defined else c.DESCRIPTION }}">
  <meta name="author" content="inforcqb">
  <meta name="theme-color" content="{{ c.THEME_COLOR }}">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="{{ c.SITE_URL }}">
  <link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml">
  <link rel="manifest" href="{{ 'manifest.webmanifest' if static_export else url_for('site.manifest') }}">
  <link rel="stylesheet" href="{{ asset('styles.css') }}">
  <noscript><style>.js .reveal{opacity:1!important;transform:none!important}</style></noscript>

  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:site_name" content="SUSFS Guard LKM">
  <meta property="og:title" content="{{ c.TITLE }}">
  <meta property="og:description" content="{{ c.OG_DESCRIPTION }}">
  <meta property="og:url" content="{{ c.SITE_URL }}">
  <meta property="og:image" content="{{ c.OG_IMAGE }}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ c.OG_IMAGE_ALT }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ c.TITLE }}">
  <meta name="twitter:description" content="{{ c.TWITTER_DESCRIPTION }}">
  <meta name="twitter:image" content="{{ c.OG_IMAGE }}">
  <meta name="twitter:image:alt" content="{{ c.OG_IMAGE_ALT }}">

  <script type="application/ld+json">
{{ c.JSON_LD | tojson(indent=2) }}
  </script>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
