name: site

on:
  push:
    branches: [site-python]
    paths:
      - app/**
      - tests/**
      - freeze.py
      - wsgi.py
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/site.yml
  schedule:
    - cron: "0 3 * * 1"  # 每周一 03:00 UTC 重建，刷新上游版本号
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Freeze static site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python freeze.py --out public
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: public
          retention-days: 7

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Probe production WSGI server (gunicorn)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gunicorn -b 127.0.0.1:8000 --workers 1 wsgi:app &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ | grep -q "把 SUSFS"
          curl -fsS http://127.0.0.1:8000/api/kmi | grep -q "android15-6.6"
          curl -fsS "http://127.0.0.1:8000/api/kmi/resolve?osrelease=6.6.30-android15-8-gabc" | grep -q "android15-6.6"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/download/android15-6.6)
          test "$code" = "302"
          echo "dynamic site smoke test passed"

  deploy:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Freeze static site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python freeze.py --out public
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "site: rebuild $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          echo "published to gh-pages"
